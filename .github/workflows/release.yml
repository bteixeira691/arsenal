name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Check publish secrets
        env:
          PUBLISH_BUN: ${{ vars.PUBLISH_BUN }}
          PUBLISH_WINGET: ${{ vars.PUBLISH_WINGET }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$PUBLISH_BUN" = "true" ] && [ -z "$NPM_TOKEN" ]; then
            echo "::error::PUBLISH_BUN is true but NPM_TOKEN is missing."
            exit 1
          fi
          if [ "$PUBLISH_WINGET" = "true" ] && [ -z "$WINGET_TOKEN" ]; then
            echo "::error::PUBLISH_WINGET is true but WINGET_TOKEN is missing."
            exit 1
          fi

  build:
    needs: preflight
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: arsenal-x86_64-unknown-linux-gnu
            linker: ""
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset: arsenal-aarch64-unknown-linux-gnu
            linker: aarch64-linux-gnu-gcc
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: arsenal-aarch64-apple-darwin
            linker: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: arsenal-x86_64-apple-darwin
            linker: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: arsenal-x86_64-pc-windows-msvc.exe
            linker: ""
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross linker
        if: matrix.linker != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}
        run: |
          set -euo pipefail
          cargo build --release --locked --target "${{ matrix.target }}"
          source="target/${{ matrix.target }}/release/arsenal"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            source="${source}.exe"
          fi
          mkdir -p dist
          cp "$source" "dist/${{ matrix.asset }}"
          if [[ "${{ matrix.asset }}" != *.exe ]]; then
            chmod +x "dist/${{ matrix.asset }}"
          fi
          node -e '
            const fs = require("node:fs");
            const crypto = require("node:crypto");
            const path = process.argv[1];
            const hash = crypto.createHash("sha256").update(fs.readFileSync(path)).digest("hex");
            process.stdout.write(hash + "\n");
          ' "dist/${{ matrix.asset }}" > "dist/${{ matrix.asset }}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  publish-bun:
    needs: release
    if: vars.PUBLISH_BUN == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Require npm token
        run: |
          if [ -z "$NPM_CONFIG_TOKEN" ]; then
            echo "::error::PUBLISH_BUN is true but the NPM_TOKEN secret is missing."
            exit 1
          fi
      - name: Check version matches tag
        working-directory: packaging/npm
        run: |
          set -euo pipefail
          version=$(bun -e 'console.log(require("./package.json").version)')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::package.json $version does not match $GITHUB_REF_NAME"
            exit 1
          fi
      - name: Check package contents
        working-directory: packaging/npm
        run: bun pm pack --dry-run
      - name: Publish to npm with Bun
        working-directory: packaging/npm
        run: bun publish --access public

  publish-winget:
    needs: release
    if: vars.PUBLISH_WINGET == 'true'
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
      WINGET_PACKAGE_ID: ${{ vars.WINGET_PACKAGE_ID || 'Bteixeira.Arsenal' }}
      WINGET_PUBLISHER: ${{ vars.WINGET_PUBLISHER || 'Bteixeira' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Require winget token
        shell: pwsh
        run: |
          if (-not $env:WINGET_TOKEN) {
            Write-Error "PUBLISH_WINGET is true but the WINGET_TOKEN secret is missing."
            exit 1
          }
      - name: Download Windows asset and hash it
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart("v")
          $asset = "arsenal-x86_64-pc-windows-msvc.exe"
          $url = "https://github.com/${{ github.repository }}/releases/download/$tag/$asset"
          Invoke-WebRequest -Uri $url -OutFile $asset
          $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLower()
          "WINGET_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ASSET_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Render manifests
        shell: bash
        run: |
          node packaging/winget/render.mjs \
            --version "$WINGET_VERSION" \
            --repo "${{ github.repository }}" \
            --id "$WINGET_PACKAGE_ID" \
            --publisher "$WINGET_PUBLISHER" \
            --sha256 "$ASSET_SHA256" \
            --out "$RUNNER_TEMP/winget"
      - name: Validate manifests
        shell: pwsh
        run: |
          $directory = Join-Path $env:RUNNER_TEMP "winget/$env:WINGET_PACKAGE_ID/$env:WINGET_VERSION"
          winget validate --manifest $directory
      - name: Submit winget PR
        shell: pwsh
        run: |
          winget install wingetcreate --accept-package-agreements --accept-source-agreements --disable-interactivity
          $directory = Join-Path $env:RUNNER_TEMP "winget/$env:WINGET_PACKAGE_ID/$env:WINGET_VERSION"
          wingetcreate submit `
            --prtitle "New package: $env:WINGET_PACKAGE_ID version $env:WINGET_VERSION" `
            --token $env:WINGET_TOKEN `
            $directory

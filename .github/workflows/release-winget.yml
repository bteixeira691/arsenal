name: release-winget

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.6.2"
        required: true
        type: string
      package_id:
        description: "winget PackageIdentifier"
        required: false
        default: Bteixeira.Arsenal
        type: string
      publisher:
        description: "winget Publisher"
        required: false
        default: Bteixeira
        type: string
      submit:
        description: "Open the winget-pkgs pull request"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-winget-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Check tag and secret
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          PUBLISH_WINGET: ${{ vars.PUBLISH_WINGET }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "::error::Invalid release tag: $RELEASE_TAG"
            exit 1
          fi
          if [ "$PUBLISH_WINGET" = "true" ] && [ -z "$WINGET_TOKEN" ]; then
            echo "::error::PUBLISH_WINGET is true but WINGET_TOKEN is missing."
            exit 1
          fi

  publish-winget:
    needs: preflight
    if: vars.PUBLISH_WINGET == 'true'
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
      WINGET_PACKAGE_ID: ${{ inputs.package_id || vars.WINGET_PACKAGE_ID || 'Bteixeira.Arsenal' }}
      WINGET_PUBLISHER: ${{ inputs.publisher || vars.WINGET_PUBLISHER || 'Bteixeira' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Require winget token
        shell: pwsh
        run: |
          if (-not $env:WINGET_TOKEN) {
            Write-Error "PUBLISH_WINGET is true but WINGET_TOKEN is missing."
            exit 1
          }
      - name: Wait for the Windows release asset
        shell: pwsh
        run: |
          $asset = "arsenal-x86_64-pc-windows-msvc.exe"
          $url = "https://github.com/${{ github.repository }}/releases/download/$env:RELEASE_TAG/$asset"
          $deadline = (Get-Date).AddMinutes(45)
          while ($true) {
            try {
              Invoke-WebRequest -Uri $url -OutFile $asset -ErrorAction Stop
              break
            } catch {
              if ((Get-Date) -gt $deadline) {
                throw "Timed out waiting for $url"
              }
              Start-Sleep -Seconds 10
            }
          }
          $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLower()
          "WINGET_VERSION=$($env:RELEASE_TAG.TrimStart('v'))" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ASSET_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Render manifests
        shell: bash
        run: |
          node packaging/winget/render.mjs \
            --version "$WINGET_VERSION" \
            --repo "${{ github.repository }}" \
            --id "$WINGET_PACKAGE_ID" \
            --publisher "$WINGET_PUBLISHER" \
            --sha256 "$ASSET_SHA256" \
            --out "$RUNNER_TEMP/winget"
      - name: Validate manifests
        shell: pwsh
        run: |
          $directory = Join-Path $env:RUNNER_TEMP "winget/$env:WINGET_PACKAGE_ID/$env:WINGET_VERSION"
          winget validate --manifest $directory
      - name: Test local install
        continue-on-error: true
        shell: pwsh
        run: |
          $directory = Join-Path $env:RUNNER_TEMP "winget/$env:WINGET_PACKAGE_ID/$env:WINGET_VERSION"
          winget settings --enable LocalManifestFiles
          winget install --manifest $directory --accept-package-agreements --accept-source-agreements --disable-interactivity
          winget uninstall --id "$env:WINGET_PACKAGE_ID" --exact --disable-interactivity
      - uses: actions/upload-artifact@v4
        with:
          name: winget-${{ env.WINGET_VERSION }}
          path: ${{ runner.temp }}/winget
          if-no-files-found: error
      - name: Submit winget PR
        if: ${{ github.event_name == 'push' || inputs.submit }}
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          winget install wingetcreate --accept-package-agreements --accept-source-agreements --disable-interactivity
          $directory = Join-Path $env:RUNNER_TEMP "winget/$env:WINGET_PACKAGE_ID/$env:WINGET_VERSION"
          wingetcreate submit `
            --prtitle "Update $env:WINGET_PACKAGE_ID to $env:WINGET_VERSION" `
            --token $env:WINGET_TOKEN `
            $directory

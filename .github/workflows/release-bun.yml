name: release-bun

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-bun-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check publish secret
        env:
          PUBLISH_BUN: ${{ vars.PUBLISH_BUN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$PUBLISH_BUN" = "true" ] && [ -z "$NPM_TOKEN" ]; then
            echo "::error::PUBLISH_BUN is true but NPM_TOKEN is missing."
            exit 1
          fi
      - name: Check tag matches Cargo and npm versions
        run: |
          set -euo pipefail
          cargo_version=$(cargo pkgid | sed 's/.*#//')
          npm_version=$(node -p "require('./packaging/npm/package.json').version")
          if [ "v$cargo_version" != "$GITHUB_REF_NAME" ] || [ "v$npm_version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo $cargo_version / npm $npm_version"
            exit 1
          fi
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked

  build:
    needs: validate
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: arsenal-x86_64-unknown-linux-gnu
            linker: ""
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset: arsenal-aarch64-unknown-linux-gnu
            linker: aarch64-linux-gnu-gcc
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: arsenal-aarch64-apple-darwin
            linker: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: arsenal-x86_64-apple-darwin
            linker: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: arsenal-x86_64-pc-windows-msvc.exe
            linker: ""
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross linker
        if: matrix.linker != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}
        run: |
          set -euo pipefail
          cargo build --release --locked --target "${{ matrix.target }}"
          source="target/${{ matrix.target }}/release/arsenal"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            source="${source}.exe"
          fi
          mkdir -p dist
          cp "$source" "dist/${{ matrix.asset }}"
          if [[ "${{ matrix.asset }}" != *.exe ]]; then
            chmod +x "dist/${{ matrix.asset }}"
          fi
          node -e '
            const fs = require("node:fs");
            const crypto = require("node:crypto");
            const path = process.argv[1];
            const hash = crypto.createHash("sha256").update(fs.readFileSync(path)).digest("hex");
            process.stdout.write(hash + "\n");
          ' "dist/${{ matrix.asset }}" > "dist/${{ matrix.asset }}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  publish-bun:
    needs: release
    if: vars.PUBLISH_BUN == 'true'
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Require npm token
        run: |
          if [ -z "$NPM_CONFIG_TOKEN" ]; then
            echo "::error::PUBLISH_BUN is true but NPM_TOKEN is missing."
            exit 1
          fi
      - name: Check version matches tag
        working-directory: packaging/npm
        run: |
          set -euo pipefail
          version=$(bun -e 'console.log(require("./package.json").version)')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::package.json $version does not match $GITHUB_REF_NAME"
            exit 1
          fi
      - name: Check package contents
        working-directory: packaging/npm
        run: bun pm pack --dry-run
      - name: Publish to npm with Bun
        working-directory: packaging/npm
        run: bun publish --access public

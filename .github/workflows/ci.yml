name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      - run: node --check packaging/npm/bin/arsenal.js
      - run: node --check packaging/winget/render.mjs
      - run: cd packaging/npm && npm pack --dry-run
      - run: node packaging/winget/render.mjs --sha256 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef --out /tmp/winget-manifests
